sonar.projectKey=rusuh-booking-service
sonar.projectName=Booking Service
sonar.projectVersion=1.0

# Sources & tests
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/_mock/**,**/vendor/**,**/bin/**

# Coverage — digenerate oleh make coverage sebelum scan
sonar.go.coverage.reportPaths=coverage.out

# Coverage exclusions (infra wiring, generated files)
sonar.coverage.exclusions=**/_mock/**,**/cmd/**,**/pkg/db/**,**/pkg/kafka/**,**/pkg/valkey/**,**/pkg/otel/**,**/pkg/logctx/**,**/pkg/middleware/**,**/pkg/apinizer/**,**/internal/delivery/**,**/internal/config/**

# SonarQube server — diisi oleh scan script
sonar.host.url=http://localhost:9000
